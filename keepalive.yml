# 保活 workflow：防止 GitHub 因仓库 60 天无动态而停用定时任务
# 这一次提交本身就算仓库动态，60 天倒计时立即重置；
# 之后它每 14 天自动提交一次空提交，永久保活。

name: Keepalive

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          workflow_files: "renew.yml"